<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勞動體驗任務</title>
<style>
  :root{
    --bg:#f2ede3;
    --paper:#fffdf7;
    --ink:#26221d;
    --muted:#7a7166;
    --line:#ddd4c4;
    --accent:#2f6b4f;
    --accent-dark:#24543e;
    --danger:#a8342a;
    --warn:#b07d16;
    --gold:#c99a2e;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:940px;margin:0 auto;padding:0 18px 80px}

  /* ---------- 頂欄 ---------- */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:26px;
  }
  .brand{font-weight:700;letter-spacing:.1em;font-size:15px}
  .wallet{font-size:13px;color:var(--muted)}
  .wallet strong{color:var(--accent);font-size:17px;margin:0 2px}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 28px;
    margin-bottom:20px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  h1{font-size:27px;margin:0 0 10px;letter-spacing:.02em}
  h2{font-size:21px;margin:0 0 14px}
  h3{font-size:17px;margin:0}
  .lead{font-size:16px;color:var(--muted);margin:0 0 18px}
  .muted{color:var(--muted)}
  .small{font-size:13px}

  /* ---------- 按鈕 ---------- */
  .btn{
    font:inherit;font-size:15px;
    padding:11px 22px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;
    transition:background .15s,border-color .15s,transform .05s;
  }
  .btn:hover{background:#f7f3ea}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:var(--accent-dark)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.wide{width:100%}
  .btn.small{font-size:13px;padding:7px 16px}

  /* ---------- 首頁 ---------- */
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:22px 0}
  .mini{
    border:1px solid var(--line);border-radius:9px;padding:16px;background:#fff;
    display:flex;flex-direction:column;gap:3px;
  }
  .mini b{font-size:15px}
  .mini small{color:var(--muted);font-size:12px}
  .mini em{font-style:normal;color:var(--accent);font-weight:700;font-size:15px;margin-top:6px}
  .stars{color:var(--gold);letter-spacing:2px;font-size:14px}

  .notice{
    background:#f7f2e6;border:1px solid #e6dbc4;border-radius:9px;
    padding:16px 20px;margin:22px 0;font-size:14px;
  }
  .notice b{display:block;margin-bottom:6px}
  .notice ul{margin:0;padding-left:20px}
  .notice li{margin:3px 0}

  /* ---------- 選關 ---------- */
  .levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:20px}
  .level{
    border:1px solid var(--line);border-radius:10px;padding:20px;background:#fff;
    display:flex;flex-direction:column;gap:7px;
    transition:border-color .15s,box-shadow .15s;
  }
  .level:hover{border-color:var(--accent);box-shadow:0 3px 12px rgba(47,107,79,.10)}
  .level .tag{font-size:13px;color:var(--accent);font-weight:600;margin:0}
  .level .desc{font-size:13.5px;color:var(--muted);margin:0;flex:1}
  .level .specs{list-style:none;margin:6px 0 12px;padding:0;font-size:13px;color:var(--muted)}
  .level .specs li{display:flex;justify-content:space-between;border-bottom:1px dotted #e8e0d0;padding:4px 0}
  .level .specs b{color:var(--ink)}

  /* ---------- 任務列 ---------- */
  .taskbar{
    position:sticky;top:0;z-index:20;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:rgba(242,237,227,.96);
    backdrop-filter:blur(8px);
    padding:12px 0;margin-bottom:18px;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .taskbar .pay b{color:var(--accent)}
  .timer{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;
    padding:3px 14px;border-radius:7px;background:#eae3d5;letter-spacing:.05em;
  }
  .timer.overtime{background:var(--danger);color:#fff;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.72}}

  /* ---------- 收據 ---------- */
  .receipt{
    background:#fffef8;
    border:1px dashed #c9bda8;
    border-radius:6px;
    padding:20px 22px 16px;
    max-width:560px;margin:0 auto;
    font-variant-numeric:tabular-nums;
    box-shadow:inset 0 0 26px rgba(200,185,155,.10);
  }
  .r-head{text-align:center;border-bottom:2px solid #3a352c;padding-bottom:10px;margin-bottom:6px}
  .r-shop{font-size:17px;font-weight:700;letter-spacing:.12em}
  .r-meta{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.04em}
  .r-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
  .r-table th{
    font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;
    padding:6px 4px;border-bottom:1px solid #ddd2bd;letter-spacing:.05em;
  }
  .r-table td{padding:7px 4px;border-bottom:1px dotted #e4dccb;vertical-align:middle}
  .r-table .r{text-align:right}
  .r-table .c{text-align:center;color:var(--muted);width:26px}
  .r-table .mark{width:28px;text-align:center}
  .r-table input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:var(--accent)}
  .r-foot{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-top:2px solid #3a352c;margin-top:10px;padding-top:10px;font-size:14px;
  }
  .r-total{font-size:17px;font-weight:700;letter-spacing:.04em}
  .r-stamp{
    text-align:center;color:#b9ae98;font-size:11px;letter-spacing:.4em;margin-top:10px;
  }

  /* ---------- 工作區 ---------- */
  .ws-title{font-size:14px;font-weight:700;margin:0 0 4px;letter-spacing:.05em}
  .ws-sub{font-size:12.5px;color:var(--muted);margin:0 0 16px}

  /* 照片上傳 */
  .photo-upload{
    margin:18px 0;padding:24px 18px;
    border:1.5px dashed var(--line);border-radius:9px;
    background:#faf7f0;text-align:center;
  }
  .photo-upload .hint{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
  .photo-upload #photoPreviewWrap{margin-top:16px}
  .photo-upload img{
    max-width:100%;max-height:420px;border-radius:6px;
    border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.10);
  }
  .photo-upload .rephoto{margin-top:10px}

  /* 核對區 */
  .checklist{
    margin-top:24px;padding-top:20px;border-top:1px dashed var(--line);
  }
  .ws-table{width:100%;border-collapse:collapse}
  .ws-table th{
    font-size:12px;color:var(--muted);text-align:left;font-weight:600;
    padding:6px 8px;letter-spacing:.05em;
  }
  .ws-table td{padding:5px 8px;border-bottom:1px dotted #e8e0d0}
  .ws-table input[type=text]{
    font:inherit;font-size:14px;width:100%;
    padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;
  }
  .ws-table input:focus, .total-input:focus, textarea:focus{
    outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);
  }

  .total-row{
    display:flex;justify-content:flex-end;align-items:center;gap:10px;
    margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);
    font-weight:700;
  }
  .total-input{
    font:inherit;font-size:17px;font-weight:700;
    width:150px;padding:9px 12px;text-align:right;
    border:1px solid var(--line);border-radius:6px;background:#fff;
    font-variant-numeric:tabular-nums;
  }
  .hkd{color:var(--muted);font-weight:600;font-size:14px}

  /* ---------- 計算機 ---------- */
  .calc-wrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  .calc{
    width:216px;border:1px solid var(--line);border-radius:9px;
    padding:11px;background:#f8f4ec;
  }
  .calc-screen{
    background:#2b2b2b;color:#8ef0b0;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    text-align:right;padding:9px 11px;border-radius:5px;font-size:19px;
    margin-bottom:9px;overflow:hidden;white-space:nowrap;
  }
  .calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .calc-keys button{
    font:inherit;font-size:15px;padding:11px 0;border-radius:5px;
    border:1px solid var(--line);background:#fff;cursor:pointer;
    transition:background .12s;
  }
  .calc-keys button:hover{background:#efe8da}
  .calc-keys button:active{transform:translateY(1px)}
  .calc-keys .op{background:#efe6d4;font-weight:600}
  .calc-keys .eq{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}

  /* ---------- 提交列 ---------- */
  .submitbar{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:16px 0 4px;
  }
  .hint{font-size:13px;color:var(--muted)}

  /* ---------- 結果面板 ---------- */
  .panel{
    border-radius:10px;padding:22px 24px;margin-bottom:20px;border:1px solid;
    animation:slideIn .25s ease-out;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .panel.reject{background:#fdf1ef;border-color:#e8c4be}
  .panel.reject h3{color:var(--danger);display:flex;align-items:center;gap:8px}
  .panel ul{margin:10px 0 16px;padding-left:22px;font-size:14px}
  .panel li{margin:5px 0}
  .panel .actions{display:flex;gap:10px;flex-wrap:wrap}

  /* ---------- 通過畫面 ---------- */
  .result-pass{text-align:center;padding:40px 28px}
  .big-icon{
    width:72px;height:72px;line-height:72px;border-radius:50%;
    background:#e3f2e8;color:var(--accent);font-size:36px;font-weight:700;
    margin:0 auto 16px;
  }
  .payout{
    font-size:44px;font-weight:800;color:var(--accent);
    margin:18px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .payout span{font-size:17px;font-weight:600;color:var(--muted);margin-left:6px}
  .stat-row{
    display:flex;justify-content:center;gap:44px;flex-wrap:wrap;
    margin:26px 0;padding:18px 0;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  .stat-row div{display:flex;flex-direction:column;gap:2px}
  .stat-row b{font-size:19px;font-variant-numeric:tabular-nums}
  .stat-row small{font-size:12px;color:var(--muted);letter-spacing:.05em}
  .notes{
    list-style:none;padding:0;margin:0 0 26px;font-size:13.5px;color:var(--warn);
  }
  .notes li{margin:4px 0}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  /* ---------- 反思 ---------- */
  .reflect-q{margin-bottom:22px}
  .reflect-q label{display:block;font-size:14.5px;font-weight:600;margin-bottom:7px}
  textarea{
    font:inherit;font-size:14px;width:100%;min-height:88px;resize:vertical;
    padding:11px 13px;border:1px solid var(--line);border-radius:7px;background:#fff;
  }
  .thanks{text-align:center;padding:44px 28px}
  .thanks .big-icon{background:#e3f2e8}

  @media (max-width:600px){
    .card{padding:20px 18px}
    .receipt{padding:16px 14px}
    .r-table{font-size:13px}
    .stat-row{gap:26px}
    .calc-wrap{justify-content:center}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="topbar">
    <div class="brand">勞 動 體 驗 任 務</div>
    <div class="wallet">班幣 <strong id="wallet">0</strong> 元</div>
  </header>
  <main id="main"></main>
</div>

<script>
/* =========================================================
   資料
   ========================================================= */
const LEVELS = [
  {
    id: 1,
    stars: '★',
    name: '基礎輸入員',
    tagline: '純體力與細心度',
    desc: '把收據上 5 項商品的名稱與價格，一字不漏手寫抄到實體工作紙上，並算出總額，完成後拍照上傳。',

      lines: [
        { no:1, name:'鉛筆',    detail:'', amount: 5.00 },

        { no:4, name:'間尺',    detail:'', amount: 4.50 },
        { no:5, name:'文件夾',  detail:'', amount: 7.00 }
      ],
      showTotal: false
    },

  },
  {
    id: 2,

    name: '進階核算員',

    desc: '13 項商品的長收據。不需抄寫，但必須用計算機快速而準確地加總所有款項。',
    instruction: '任務內容：下方是一張 13 項商品的長收據。請使用計算機（可用右方工具，或自備計算機／計算機 App），把所有金額加總，填上正確總額。項目多，容易按錯，請小心。',
    limitMin: 18,
    pay: 30,
    receipt: {
      shop: '好 運 超 級 市 場',
      meta: '日期：2026-10-23　　單號：B-0487　　收銀員：陳',

        { no:1,  name:'牛奶 250ml',    detail:'2 × 7.90',  amount: 15.80 },

        { no:5,  name:'食用油 900ml',  detail:'1 × 32.40', amount: 32.40 },
        { no:6,  name:'鹽',            detail:'1 × 4.20',  amount:  4.20 },
        { no:7,  name:'糖 1kg',        detail:'1 × 9.90',  amount:  9.90 },
        { no:8,  name:'即食麵 5 包裝', detail:'1 × 18.60', amount: 18.60 },
        { no:9,  name:'礦泉水 1.5L',   detail:'3 × 5.50',  amount: 16.50 },
        { no:10, name:'洗潔精 500ml',  detail:'1 × 16.90', amount: 16.90 },
        { no:11, name:'牙膏',          detail:'1 × 21.30', amount: 21.30 },
        { no:12, name:'廁紙 10 卷',    detail:'1 × 42.70', amount: 42.70 },
        { no:13, name:'垃圾袋',        detail:'1 × 13.80', amount: 13.80 }
      ],
      showTotal: false
    },
    answer: { total: 286.40 }
  },
  {
    id: 3,
    stars: '★★★',
    name: '高級審核員',
    tagline: '問題解決與判斷力',
    desc: '收據已算好總額，但裡面暗藏 2 個錯誤。你需要找出它們，並算出正確總額。',
    instruction: '任務內容：這張收據的總額已經算好了，但當中有 2 個錯誤。請逐行核對「數量 × 單價」是否等於「金額」，並檢查是否有不該出現的重複收費。勾選你認為有問題的行，然後寫出正確的總金額。',
    limitMin: 25,
    pay: 50,
    receipt: {
      shop: '好 運 超 級 市 場',
      meta: '日期：2026-10-23　　單號：C-0913　　收銀員：黃',
      lines: [
        { no:1, name:'米 5kg',        detail:'2 包 × 58.00', amount: 116.00 },
        { no:2, name:'雞蛋 10 隻',    detail:'1 盒 × 23.80', amount:  23.80 },
        { no:3, name:'牛奶 250ml',    detail:'4 盒 × 7.90',  amount:  31.60 },
        { no:4, name:'可樂 330ml',    detail:'2 罐 × 5.50',  amount:  16.50 },
        { no:5, name:'白麵包',        detail:'1 個 × 12.50', amount:  12.50 },
        { no:6, name:'廁紙 10 卷',    detail:'1 包 × 42.70', amount:  42.70 },

        { no:8, name:'膠袋徵費',      detail:'',             amount:   1.00 }
      ],
      showTotal: true,
      total: 245.10
    },
    answer: {
      mustMark: [4, 8],
      allowMark: [7],
      forbidden: [1,2,3,5,6],
      total: 238.60
    }
  }
];

/* =========================================================
   狀態
   ========================================================= */
const S = {
  screen: 'home',
  levelId: null,
  attempts: 0,
  pausedMs: 0,
  startTs: 0,
  running: false,
  tickId: null,
  coins: 0,
  logs: [],
  reflections: []
};

const mainEl = document.getElementById('main');
const walletEl = document.getElementById('wallet');

/* =========================================================
   工具函數
   ========================================================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const getLevel = () => LEVELS.find(l => l.id === S.levelId);

function fmtTime(ms){
  const t = Math.max(0, Math.floor(ms / 1000));
  const m = String(Math.floor(t / 60)).padStart(2, '0');
  const s = String(t % 60).padStart(2, '0');
  return `${m}:${s}`;
}
function money(n){ return n.toFixed(2); }
function updateWallet(){ walletEl.textContent = S.coins; }

/* ---- 計時器 ---- */
function elapsedMs(){
  return S.pausedMs + (S.running ? Date.now() - S.startTs : 0);
}
function resumeTimer(){
  if (S.running) return;
  S.startTs = Date.now();
  S.running = true;
  if (!S.tickId) S.tickId = setInterval(updateTimerDisplay, 200);
  updateTimerDisplay();
}
function pauseTimer(){
  if (!S.running) return;
  S.pausedMs += Date.now() - S.startTs;
  S.running = false;
  if (S.tickId){ clearInterval(S.tickId); S.tickId = null; }
}
function resetTimer(){
  pauseTimer();
  S.pausedMs = 0;
}
function updateTimerDisplay(){
  const el = $('#timer');
  if (!el) return;
  const lv = getLevel();
  const ms = elapsedMs();
  el.textContent = fmtTime(ms);
  if (lv) el.classList.toggle('overtime', ms > lv.limitMin * 60000);
}

/* =========================================================
   畫面：首頁
   ========================================================= */
function renderHome(){
  mainEl.innerHTML = `
    <section class="card">
      <h1>勞動體驗任務</h1>
      <p class="lead">這不是遊戲。這是一次「真實勞動」的模擬。</p>
      <p style="margin:0 0 4px">你將會收到一張真實的收據，並按難度完成不同任務。任務要求 <b>一字不漏</b>、<b>一毫不差</b>。任何錯誤都會被退回。</p>

      <div class="grid3">
        <div class="mini">
          <span class="stars">★</span>
          <b>基礎輸入員</b>
          <small>手寫抄寫、細心、拍照上傳</small>
          <em>10 元</em>
        </div>
        <div class="mini">
          <span class="stars">★★</span>
          <b>進階核算員</b>
          <small>計算機操作、抗壓</small>
          <em>30 元</em>
        </div>
        <div class="mini">
          <span class="stars">★★★</span>
          <b>高級審核員</b>
          <small>批判思考、審核判斷</small>
          <em>50 元</em>
        </div>
      </div>

      <div class="notice">
        <b>規則</b>
        <ul>
          <li>報酬以「班幣」計算，不是真錢。</li>

          <li>提交後如有錯誤，會被退回並列明原因。</li>

  S.attempts = 0;
  resetTimer();
  calcState = { disp: '0', acc: null, op: null, fresh: true };
  renderTask();
  resumeTimer();
  window.scrollTo({ top: 0, behavior: 'instant' });

    <div class="receipt">

      <table class="r-table">
        <thead>
          <tr>
            ${markable ? '<th></th>' : ''}

        </thead>
        <tbody>${rows}</tbody>

        <div class="small muted">項目數：${r.lines.length}</div>
        ${r.showTotal ? `<div class="r-total">總額　HK$ ${money(r.total)}</div>` : '<div class="small muted">總額：待核算</div>'}
      </div>
      <div class="r-stamp">已 付 款</div>

}

/* ---- 工作區 HTML ---- */

    const checkRows = lv.receipt.lines.map((l, i) => `
      <tr>

        </td>
      </tr>
    `).join('');

    return `
      <p class="ws-title">實體工作紙</p>
      <p class="ws-sub">請在老師提供的空白工作紙上，<b>用筆手寫</b>抄寫上方收據的全部內容，並自行計算總額。完成後拍照上傳。本頁不提供打字輸入。</p>

      <div class="photo-upload" id="photoUploadArea">

        <p class="hint" id="photoHint">支援手機相機或電腦檔案。照片必須清晰可讀，能看見全部手寫內容。</p>
        <div id="photoPreviewWrap" hidden>
          <img id="photoPreview" alt="工作紙照片預覽">
          <br>
          <button class="btn small rephoto" id="rephotoBtn" type="button">重新上傳</button>
        </div>
      </div>

      <div class="checklist" id="checklist" hidden>
        <p class="ws-title">核對區（由老師或助手操作）</p>
        <p class="ws-sub">請對照上方照片，逐項核對學生手寫內容是否與收據完全一致（名稱一字不漏、價格一毫不差）。全部正確才勾選。</p>
        <table class="ws-table">
          <thead>
            <tr>
              <th>項目</th>
              <th>標準答案</th>
              <th style="text-align:center">正確</th>
            </tr>
          </thead>
          <tbody>
            ${checkRows}
            <tr>
              <td style="color:var(--muted)"><b>總額</b></td>
              <td><b>${money(lv.answer.total)}</b></td>
              <td style="text-align:center">
                <input type="checkbox" data-check-l1="total" aria-label="總額正確"
                       style="width:18px;height:18px;cursor:pointer;accent-color:var(--accent)">
              </td>
            </tr>
          </tbody>

  }

  /* ===== 級別二 ===== */
  if (lv.id === 2){
    return `
      <p class="ws-title">核　算　區</p>
      <p class="ws-sub">使用計算機把上方 13 項金額加總。按錯一鍵，全盤皆錯。</p>
      <div class="calc-wrap">
        <div style="flex:1;min-width:200px">
          <div class="total-row" style="margin-top:0;padding-top:0;border-top:none">

            <span class="hkd">HK$</span>
            <input class="total-input" id="l2total" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">

    <div class="total-row">
      <span>正確總金額</span>
      <span class="hkd">HK$</span>
      <input class="total-input" id="l3total" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
    </div>

}

/* ---- 計算機 ---- */
function calcHTML(){
  const keys = ['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'];
  return `
    <div class="calc">
      <div class="calc-screen" id="calcDisp">0</div>
      <div class="calc-keys">
        ${keys.map(k => {
          let cls = '';
          if (['÷','×','−','+'].includes(k)) cls = 'op';
          if (k === '=') cls = 'eq';
          return `<button type="button" class="${cls}" data-calc="${k}">${k}</button>`;
        }).join('')}
      </div>
    </div>
  `;
}

let calcState = { disp: '0', acc: null, op: null, fresh: true };

function calcRender(){
  const el = $('#calcDisp');
  if (el) el.textContent = calcState.disp;
}
function calcNum(n){
  if (!isFinite(n)) return 'Error';
  return String(Math.round(n * 100) / 100);
}
function calcApply(a, b, op){
  switch (op){
    case '+': return a + b;
    case '−': return a - b;
    case '×': return a * b;
    case '÷': return b === 0 ? NaN : a / b;
  }
}
function calcPress(k){
  const st = calcState;

  if (k >= '0' && k <= '9'){
    st.disp = (st.fresh || st.disp === '0') ? k : st.disp + k;
    st.fresh = false;
  } else if (k === '.'){
    if (st.fresh){ st.disp = '0.'; st.fresh = false; }
    else if (!st.disp.includes('.')) st.disp += '.';
  } else if (k === '='){
    if (st.op !== null && st.acc !== null){
      st.disp = calcNum(calcApply(st.acc, parseFloat(st.disp), st.op));
      st.acc = null; st.op = null; st.fresh = true;
    }
  } else {
    const cur = parseFloat(st.disp);
    if (st.op !== null && st.acc !== null && !st.fresh){
      const r = calcApply(st.acc, cur, st.op);
      st.acc = r;
      st.disp = calcNum(r);
    } else {
      st.acc = cur;
    }
    st.op = k;
    st.fresh = true;
  }
  calcRender();
}

/* ---- 綁定工作區 ---- */
function bindWorkspace(lv){
  if (lv.id === 1){
    /* 級別一：照片上傳預覽 */
    const input      = $('#photoInput');
    const photoBtn   = $('#photoBtn');
    const rephotoBtn = $('#rephotoBtn');
    const previewWrap= $('#photoPreviewWrap');
    const preview    = $('#photoPreview');
    const checklist  = $('#checklist');
    const hint       = $('#photoHint');
    let objectUrl    = null;

    const openPicker = () => input.click();
    photoBtn.addEventListener('click', openPicker);
    rephotoBtn.addEventListener('click', openPicker);

    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      preview.src = objectUrl;
      previewWrap.hidden = false;
      checklist.hidden = false;
      photoBtn.textContent = '已上傳，可重新選擇';
      hint.textContent = '照片已上傳。如不清晰，請按「重新上傳」。';
    });
    return;
  }

  /* 級別二、三：禁止貼上，綁定計算機與回車 */
  $$('#workspace input[type=text]').forEach(inp => {
    inp.addEventListener('paste', e => e.preventDefault());
    inp.addEventListener('drop', e => e.preventDefault());
  });

  $$('[data-calc]').forEach(btn => {
    btn.addEventListener('click', () => calcPress(btn.dataset.calc));
  });
  calcRender();

  $$('#workspace input[type=text]').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') $('#submitBtn').click();
    });
  });
}

/* =========================================================
   檢查邏輯
   ========================================================= */
function parseNum(str){
  if (!str) return NaN;
  const v = parseFloat(String(str).replace(/[,\s]/g, ''));
  return isNaN(v) ? NaN : v;
}

function checkL1(){
  const reasons = [];

  const photo = $('#photoInput') && $('#photoInput').files[0];
  if (!photo){
    reasons.push('尚未上傳工作紙照片，請先手寫完成並拍照上傳');
  }

  const checks = $$('[data-check-l1]');
  const unchecked = checks.filter(c => !c.checked);
  if (checks.length && unchecked.length){
    reasons.push(`核對區尚有 ${unchecked.length} 項未確認（需由老師或助手逐項核對後勾選）`);
  }

  return { reasons };
}

function checkL2(){
  const lv = getLevel();
  const reasons = [];
  const t = parseNum($('#l2total').value);

  if (isNaN(t)){
    reasons.push('總額未填寫或不是有效數字');
  } else if (Math.abs(t - lv.answer.total) > 0.004){
    reasons.push('總額不正確，請重新核算（提示：13 個項目，逐項加總）');
  }
  return { reasons };
}

function checkL3(){
  const lv = getLevel();
  const a = lv.answer;
  const reasons = [];

  const checked = $$('[data-l3row]:checked').map(el => Number(el.dataset.l3row));
  const missing = a.mustMark.filter(n => !checked.includes(n));
  const wrong   = checked.filter(n => a.forbidden.includes(n));

  if (missing.length){
    reasons.push(`仍有 ${missing.length} 個錯誤行未被標記`);
  }
  if (wrong.length){
    reasons.push(`有 ${wrong.length} 個被標記的行其實沒有錯誤`);
  }

  const t = parseNum($('#l3total').value);
  if (isNaN(t)){
    reasons.push('正確總金額未填寫或不是有效數字');
  } else if (Math.abs(t - a.total) > 0.004){
    reasons.push('正確總金額不正確');
  }

  return { reasons };
}

/* =========================================================
   提交
   ========================================================= */
function handleSubmit(){
  const lv = getLevel();
  const btn = $('#submitBtn');

  btn.disabled = true;
  pauseTimer();
  S.attempts++;

  const res = lv.id === 1 ? checkL1() : lv.id === 2 ? checkL2() : checkL3();
  const ms = elapsedMs();
  const overTime = ms > lv.limitMin * 60000;

  if (res.reasons.length === 0){
    let pay = lv.pay;
    const notes = [];
    if (S.attempts > 1){
      pay = Math.round(pay / 2);
      notes.push('退回修正後通過，報酬減半。');
    }
    if (overTime){
      pay = Math.round(pay * 0.8);
      notes.push('超過限時，報酬扣減 20%。');
    }
    S.coins += pay;
    updateWallet();
    S.logs.push({ level: lv.id, pay, ms, attempts: S.attempts });
    renderPassed(pay, ms, notes);
  } else {
    const canRetry = S.attempts === 1;
    renderRejected(res.reasons, canRetry, ms);
  }
}

/* ---- 退回面板 ---- */
function renderRejected(reasons, canRetry, ms){
  const panel = $('#resultPanel');
  const lv = getLevel();

  panel.hidden = false;
  panel.innerHTML = `
    <div class="panel reject">
      <h3>⚠ 任務被退回</h3>
      <p class="small" style="margin:0 0 4px">以下是退回原因（共 ${reasons.length} 項）：</p>
      <ul>
        ${reasons.map(r => `<li>${r}</li>`).join('')}
      </ul>
      ${canRetry
        ? `<p class="small muted" style="margin:0 0 14px">
             你有一次修正機會。${lv.id === 1 ? '可重新上傳照片並請老師重新核對。' : '請修正後重新提交。'}
             再次提交若通過，報酬由 ${lv.pay} 元減半為 ${Math.round(lv.pay/2)} 元。
           </p>
           <div class="actions">
             <button class="btn primary" id="retryBtn">修正後重新提交</button>
             <button class="btn" id="giveupBtn">放棄這個任務</button>
           </div>`
        : `<p class="small muted" style="margin:0 0 14px">你已用完修正機會。本次任務報酬為 <b>0 元</b>。</p>
           <div class="actions">
             <button class="btn" id="redoBtn">重新開始此任務</button>
             <button class="btn" id="giveupBtn">返回選擇</button>
           </div>`
      }
    </div>
  `;

  if (canRetry){
    $('#retryBtn').addEventListener('click', () => {
      panel.hidden = true;
      const sb = $('#submitBtn');
      sb.disabled = false;
      sb.textContent = '再次提交';
      resumeTimer();
      updateTimerDisplay();
      panel.innerHTML = '';
    });
  } else {
    $('#redoBtn').addEventListener('click', () => startLevel(lv.id));
  }

  $('#giveupBtn').addEventListener('click', () => {
    pauseTimer();
    renderSelect();
  });

  panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---- 通過畫面 ---- */
function renderPassed(pay, ms, notes){
  const lv = getLevel();
  pauseTimer();

  mainEl.innerHTML = `
    <section class="card result-pass">
      <div class="big-icon">✓</div>
      <h2 style="margin-bottom:4px">任務完成</h2>
      <p class="muted small" style="margin:0">
        <span class="stars">${lv.stars}</span> ${lv.name}
      </p>

      <div class="payout">+${pay}<span>班幣</span></div>

      <div class="stat-row">
        <div><b>${fmtTime(ms)}</b><small>實際用時</small></div>
        <div><b>${S.attempts}</b><small>提交次數</small></div>
        <div><b>${lv.limitMin}:00</b><small>限時</small></div>
      </div>

      ${notes.length ? `<ul class="notes">${notes.map(n => `<li>· ${n}</li>`).join('')}</ul>` : ''}

      <div class="actions">
        <button class="btn" id="againBtn">選擇其他任務</button>
        <button class="btn primary" id="reflectBtn">寫反思</button>
      </div>
    </section>
  `;

  $('#againBtn').addEventListener('click', renderSelect);
  $('#reflectBtn').addEventListener('click', renderReflect);
  updateWallet();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   反思
   ========================================================= */
function renderReflect(){
  mainEl.innerHTML = `
    <section class="card">
      <h2>勞動反思</h2>
      <p class="muted small" style="margin-top:-8px;margin-bottom:26px">
        用 3 分鐘，寫下你剛才真實的感受。這部分沒有標準答案。
      </p>

      <div class="reflect-q">
        <label>1. 哪一刻最枯燥？你當時想放棄嗎？</label>
        <textarea id="q1" placeholder="例如：抄到第 4 項時，發現自己一直在重複同樣的動作……"></textarea>
      </div>

      <div class="reflect-q">
        <label>2. 你是用什麼方法避免出錯的？</label>
        <textarea id="q2" placeholder="例如：每抄一項就回頭對一次收據……"></textarea>
      </div>

      <div class="reflect-q">
        <label>3. 你覺得「責任心」在這份工作裡，具體表現在哪裡？</label>
        <textarea id="q3" placeholder="例如：明知沒人會立刻發現，但仍然堅持核對最後一次……"></textarea>
      </div>

      <div class="actions" style="justify-content:flex-start">
        <button class="btn primary" id="saveReflect">完成</button>
        <button class="btn" id="skipReflect">略過</button>
      </div>
    </section>
  `;

  $('#saveReflect').addEventListener('click', () => {
    S.reflections.push({
      q1: $('#q1').value.trim(),
      q2: $('#q2').value.trim(),
      q3: $('#q3').value.trim()
    });
    renderThanks();
  });

  $('#skipReflect').addEventListener('click', renderThanks);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderThanks(){
  const total = S.coins;

  mainEl.innerHTML = `
    <section class="card thanks">
      <div class="big-icon">✓</div>
      <h2>體驗結束</h2>
      <p class="muted" style="max-width:520px;margin:0 auto 24px">
        你剛才做的，就是很多人每天八小時在做的事。<br>
        重複、單調、不能出錯——這就是勞動的真實重量。
      </p>

      <div class="stat-row">
        <div><b>${total}</b><small>累計班幣</small></div>
        <div><b>${S.logs.length}</b><small>完成任務數</small></div>
      </div>

      <div class="actions">
        <button class="btn primary" id="homeBtn">回到首頁</button>
      </div>
    </section>
  `;

  $('#homeBtn').addEventListener('click', () => {
    S.coins = 0;
    S.logs = [];
    S.reflections = [];
    S.attempts = 0;
    S.levelId = null;
    resetTimer();
    updateWallet();
    renderHome();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  updateWallet();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   啟動
   ========================================================= */
renderHome();
updateWallet();
</script>
