<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>座位表</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif;
    background: linear-gradient(135deg, #fef9e7 0%, #e8f8f5 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    color: #e67e22;
    font-size: 32px;
    margin: 10px 0 5px;
    text-shadow: 2px 2px 0 #fff;
  }

  .subtitle {
    color: #7f8c8d;
    font-size: 18px;
    margin-bottom: 15px;
  }

  .question-box {
    background: #fff;
    border: 3px dashed #f39c12;
    border-radius: 20px;
    padding: 15px 30px;
    margin-bottom: 20px;
    font-size: 24px;
    color: #2c3e50;
    font-weight: bold;
    text-align: center;
    min-width: 400px;
    box-shadow: 0 4px 10px rgba(243, 156, 18, 0.2);
  }

  .question-box .highlight {
    color: #e74c3c;
    font-size: 28px;
  }

  .mode-title {
    font-size: 20px;
    font-weight: bold;
    color: #e91e63;
    background: #fce4ec;
    padding: 8px 25px;
    border-radius: 25px;
    margin-bottom: 15px;
    display: inline-block;
  }

  .main-area {
    display: flex;
    gap: 40px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  .seat-table {
    border-collapse: separate;
    border-spacing: 8px;
    background: #fff;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  }

  .seat-table td {
    width: 90px;
    height: 90px;
    padding: 0;
    vertical-align: middle;
    text-align: center;
    position: relative;
  }

  .seat-table td.col-label-left {
    width: 70px;
    font-size: 16px;
    font-weight: bold;
    color: #7f8c8d;
    background: transparent;
  }

  .seat-table td.row-label-bottom {
    height: 40px;
    font-size: 16px;
    font-weight: bold;
    color: #7f8c8d;
    background: transparent;
  }

  .seat-table td.teacher-desk {
    background: #b5651d;
    color: #fff;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    height: 60px;
    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.15);
  }

  .seat {
    width: 90px;
    height: 90px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
    border: 3px dashed rgba(0, 0, 0, 0.08);
    margin: 0 auto;
  }

  .seat.over {
    transform: scale(1.08);
    border: 3px dashed #e67e22;
    box-shadow: 0 0 15px rgba(230, 126, 34, 0.5);
  }

  .color-pink   { background: #ffd6e0; }
  .color-yellow { background: #fff4c2; }
  .color-green  { background: #d4f5d4; }
  .color-blue   { background: #d6eaff; }
  .color-purple { background: #e5d4ff; }

  .student {
    font-size: 46px;
    cursor: grab;
    transition: transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  .student:active {
    cursor: grabbing;
    transform: scale(1.15);
  }

  .student.dragging {
    opacity: 0.4;
  }

  .waiting-area {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 180px;
  }

  .waiting-area h2 {
    color: #8e44ad;
    font-size: 20px;
    margin: 0 0 15px;
  }

  .waiting-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .waiting-slot {
    width: 80px;
    height: 80px;
    background: #f5f0ff;
    border: 2px dashed #b39ddb;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .waiting-slot .name-tag {
    position: absolute;
    bottom: -20px;
    font-size: 14px;
    color: #666;
    white-space: nowrap;
  }

  .btn-group {
    display: flex;
    gap: 15px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    padding: 14px 30px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15);
    color: #fff;
  }

  button:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
  }

  #btnNewQ {
    background: linear-gradient(135deg, #f39c12, #e67e22);
  }

  #btnReset {
    background: linear-gradient(135deg, #3498db, #2980b9);
  }

  .feedback {
    font-size: 26px;
    font-weight: bold;
    margin-top: 15px;
    min-height: 40px;
    text-align: center;
  }

  .feedback.correct {
    color: #27ae60;
    animation: pop 0.5s;
  }

  .feedback.wrong {
    color: #e74c3c;
    animation: shake 0.5s;
  }

  @keyframes pop {
    0% { transform: scale(0.5); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .mark {
    position: absolute;
    top: -8px;
    right: -8px;
    font-size: 28px;
    animation: pop 0.3s;
    z-index: 10;
  }

  .reward-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .reward-overlay.show {
    display: flex;
  }

  .reward-box {
    background: #fff;
    border-radius: 30px;
    padding: 40px 60px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    animation: pop 0.5s;
  }

  .reward-box .flower {
    font-size: 100px;
    animation: spin 2s infinite linear;
  }

  @keyframes spin {
    0% { transform: rotate(-15deg); }
    50% { transform: rotate(15deg); }
    100% { transform: rotate(-15deg); }
  }

  .reward-box h2 {
    color: #e74c3c;
    font-size: 32px;
    margin: 10px 0;
  }

  .reward-box button {
    background: linear-gradient(135deg, #f39c12, #e67e22);
    margin-top: 20px;
  }

  .progress {
    font-size: 24px;
    color: #f39c12;
    margin-top: 10px;
    letter-spacing: 5px;
  }
</style>
</head>
<body>

  <h1>🐘 座位表</h1>
  <p class="subtitle">拖曳小朋友到正確的座位上吧！</p>

  <div class="question-box" id="questionBox">
    請點擊「出題」開始練習 😊
  </div>

  <div style="text-align:center;">
    <span class="mode-title" id="modeTitle">📐 座位表 (5個 x 5行)</span>
  </div>

  <div class="main-area">
    <table class="seat-table" id="seatTable"></table>

    <div class="waiting-area">
      <h2>👦 待選小朋友 👧</h2>
      <div class="waiting-list" id="waitingList"></div>
    </div>
  </div>

  <div class="btn-group">
    <button id="btnNewQ">🎯 出題</button>
    <button id="btnReset">🔄 重設</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <div class="progress" id="progress"></div>

  <div class="reward-overlay" id="rewardOverlay">
    <div class="reward-box">
      <div class="flower">🌺</div>
      <h2>恭喜你完成任務！</h2>
      <p style="font-size: 22px; color: #7f8c8d;">送你一朵小紅花！</p>
      <button id="btnPlayAgain">再玩一次</button>
    </div>
  </div>

<script>
  // ====== 學生資料 ======
  const students = [
    { id: 'student1', name: '心悦', emoji: '👧🏻' },
    { id: 'student2', name: '可晴', emoji: '👩🏻' },
    { id: 'student3', name: '浩庭', emoji: '👦🏻' },
    { id: 'student4', name: '柏康', emoji: '🧑🏻' }
  ];

  // ====== 常數 ======
  const TOTAL_ROWS = 5;
  const TOTAL_COLS = 5;

  // ====== 狀態 ======
  let currentQuestion = null;
  let correctStreak = 0;
  let placedStudents = {};
  let dragData = null;

  // ====== DOM ======
  const seatTable = document.getElementById('seatTable');
  const waitingList = document.getElementById('waitingList');
  const questionBox = document.getElementById('questionBox');
  const feedback = document.getElementById('feedback');
  const progress = document.getElementById('progress');
  const rewardOverlay = document.getElementById('rewardOverlay');

  const colorClasses = ['color-pink', 'color-yellow', 'color-green', 'color-blue', 'color-purple'];

  // ====== 初始化座位表（固定為：左側標「個」、底部標「行」） ======
  function redrawTable() {
    seatTable.innerHTML = '';

    for (let visualRow = 0; visualRow < TOTAL_ROWS; visualRow++) {
      const tr = document.createElement('tr');

      // 左側標籤：第 1 個 ~ 第 5 個（由上而下）
      const leftLabelTd = document.createElement('td');
      leftLabelTd.className = 'col-label-left';
      leftLabelTd.textContent = `第 ${visualRow + 1} 個`;
      tr.appendChild(leftLabelTd);

      for (let col = 1; col <= TOTAL_COLS; col++) {
        const td = document.createElement('td');

        const seat = document.createElement('div');
        // 顏色斜向循環
        const colorIndex = (visualRow + col - 1) % 5;
        seat.className = `seat ${colorClasses[colorIndex]}`;
        // 內部資料：row 由上而下編號（第 1 列 = 1），col 由左而右編號（第 1 欄 = 1）
        seat.dataset.row = visualRow + 1;
        seat.dataset.col = col;
        seat.id = `seat-${visualRow + 1}-${col}`;

        seat.addEventListener('dragover', handleDragOver);
        seat.addEventListener('dragleave', handleDragLeave);
        seat.addEventListener('drop', handleDrop);

        td.appendChild(seat);
        tr.appendChild(td);
      }

      seatTable.appendChild(tr);
    }

    // 底部標籤列：第 1 行 ~ 第 5 行（由左而右）
    const bottomTr = document.createElement('tr');
    const bottomCornerTd = document.createElement('td');
    bottomCornerTd.className = 'col-label-left';
    bottomTr.appendChild(bottomCornerTd);

    for (let col = 1; col <= TOTAL_COLS; col++) {
      const td = document.createElement('td');
      td.className = 'row-label-bottom';
      td.textContent = `第 ${col} 行`;
      bottomTr.appendChild(td);
    }
    seatTable.appendChild(bottomTr);

    // 老師的桌子列
    const teacherTr = document.createElement('tr');
    const teacherCornerTd = document.createElement('td');
    teacherCornerTd.className = 'col-label-left';
    teacherTr.appendChild(teacherCornerTd);

    const teacherTd = document.createElement('td');
    teacherTd.className = 'teacher-desk';
    teacherTd.colSpan = TOTAL_COLS;
    teacherTd.textContent = '🐘 老師的桌子 (講台區)';
    teacherTr.appendChild(teacherTd);
    seatTable.appendChild(teacherTr);
  }

  // ====== 初始化待選區 ======
  function initWaitingArea() {
    waitingList.innerHTML = '';
    students.forEach(s => {
      const slot = document.createElement('div');
      slot.className = 'waiting-slot';
      slot.dataset.studentId = s.id;

      const studentEl = createStudentEl(s);
      slot.appendChild(studentEl);

      const nameTag = document.createElement('span');
      nameTag.className = 'name-tag';
      nameTag.textContent = s.name;
      slot.appendChild(nameTag);

      studentEl.setAttribute('draggable', 'true');
      studentEl.addEventListener('dragstart', handleDragStart);
      studentEl.addEventListener('dragend', handleDragEnd);

      slot.addEventListener('dragover', handleDragOver);
      slot.addEventListener('dragleave', handleDragLeave);
      slot.addEventListener('drop', handleDropOnWaiting);

      waitingList.appendChild(slot);
    });
  }

  // ====== 建立學生元素 ======
  function createStudentEl(student) {
    const el = document.createElement('div');
    el.className = 'student';
    el.textContent = student.emoji;
    el.dataset.studentId = student.id;
    el.setAttribute('draggable', 'true');
    el.addEventListener('dragstart', handleDragStart);
    el.addEventListener('dragend', handleDragEnd);
    return el;
  }

  // ====== 拖曳處理 ======
  function handleDragStart(e) {
    const studentEl = e.target.closest('.student');
    if (!studentEl) return;

    const studentId = studentEl.dataset.studentId;
    let from = 'waiting';
    let row = null, col = null;

    const seat = studentEl.closest('.seat');
    if (seat) {
      from = 'seat';
      row = parseInt(seat.dataset.row);
      col = parseInt(seat.dataset.col);
    }

    dragData = { studentId, from, row, col };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', studentId);
    studentEl.classList.add('dragging');
  }

  function handleDragEnd(e) {
    const studentEl = e.target.closest('.student');
    if (studentEl) studentEl.classList.remove('dragging');
    document.querySelectorAll('.seat.over').forEach(s => s.classList.remove('over'));
    document.querySelectorAll('.waiting-slot.over').forEach(s => s.classList.remove('over'));
  }

  function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const target = e.currentTarget;
    if (target.classList.contains('seat') || target.classList.contains('waiting-slot')) {
      target.classList.add('over');
    }
  }

  function handleDragLeave(e) {
    e.currentTarget.classList.remove('over');
  }

  function handleDrop(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('over');
    if (!dragData) return;

    const seat = e.currentTarget;
    const targetRow = parseInt(seat.dataset.row);
    const targetCol = parseInt(seat.dataset.col);

    moveStudentToSeat(dragData.studentId, targetRow, targetCol);
    dragData = null;

    autoCheckAnswer();
  }

  function handleDropOnWaiting(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('over');
    if (!dragData) return;
    moveStudentToWaiting(dragData.studentId);
    dragData = null;
  }

  // ====== 移動學生 ======
  function moveStudentToSeat(studentId, row, col) {
    const student = students.find(s => s.id === studentId);
    if (!student) return;

    const existingEl = document.querySelector(`#seat-${row}-${col} .student`);
    if (existingEl) {
      moveStudentToWaiting(existingEl.dataset.studentId);
    }

    if (dragData && dragData.from === 'seat') {
      const oldSeat = document.querySelector(`#seat-${dragData.row}-${dragData.col}`);
      if (oldSeat) {
        const oldStudent = oldSeat.querySelector('.student');
        if (oldStudent) oldStudent.remove();
        const oldMark = oldSeat.querySelector('.mark');
        if (oldMark) oldMark.remove();
      }
    } else {
      const oldSlot = document.querySelector(`.waiting-slot[data-student-id="${studentId}"]`);
      if (oldSlot) {
        const oldStudent = oldSlot.querySelector('.student');
        if (oldStudent) oldStudent.remove();
      }
    }

    const targetSeat = document.querySelector(`#seat-${row}-${col}`);
    const newStudentEl = createStudentEl(student);
    const oldMark = targetSeat.querySelector('.mark');
    if (oldMark) oldMark.remove();
    targetSeat.appendChild(newStudentEl);

    placedStudents[studentId] = { row, col };
    feedback.textContent = '';
    feedback.className = 'feedback';
  }

  function moveStudentToWaiting(studentId) {
    const student = students.find(s => s.id === studentId);
    if (!student) return;

    if (placedStudents[studentId]) {
      const { row, col } = placedStudents[studentId];
      const seat = document.querySelector(`#seat-${row}-${col}`);
      if (seat) {
        const el = seat.querySelector('.student');
        if (el) el.remove();
        const mark = seat.querySelector('.mark');
        if (mark) mark.remove();
      }
      delete placedStudents[studentId];
    }

    const existingSlot = document.querySelector(`.waiting-slot[data-student-id="${studentId}"]`);
    if (existingSlot && !existingSlot.querySelector('.student')) {
      const studentEl = createStudentEl(student);
      existingSlot.insertBefore(studentEl, existingSlot.firstChild);
    }
  }

  // ====== 出題 ======
  function newQuestion() {
    document.querySelectorAll('.mark').forEach(m => m.remove());
    feedback.textContent = '';
    feedback.className = 'feedback';

    const randomStudent = students[Math.floor(Math.random() * students.length)];
    const qRow = Math.floor(Math.random() * TOTAL_ROWS) + 1;  // 第 1~5 行
    const qCol = Math.floor(Math.random() * TOTAL_COLS) + 1;  // 第 1~5 個

    currentQuestion = { studentId: randomStudent.id, row: qRow, col: qCol };

    questionBox.innerHTML = `請把 <span class="highlight">${randomStudent.emoji} ${randomStudent.name}</span> 放在 <span class="highlight">第 ${qRow} 行 第 ${qCol} 個</span> 座位`;
  }

  // ====== 自動檢查答案 ======
  function autoCheckAnswer() {
    if (!currentQuestion) return;

    document.querySelectorAll('.mark').forEach(m => m.remove());

    const studentId = currentQuestion.studentId;
    const qRow = currentQuestion.row;  // 題目的「行」
    const qCol = currentQuestion.col;  // 題目的「個」
    const placed = placedStudents[studentId];

    if (!placed) return;

    // ★ 固定座位表：左側標「個」（由上而下）、底部標「行」（由左而右）
    // 題目的「行」= 底部 = 內部 col
    // 題目的「個」= 左側 = 內部 row
    const targetRow = qCol;  // 題目的「個」對應內部 row（左側）
    const targetCol = qRow;  // 題目的「行」對應內部 col（底部）

    if (placed.row === targetRow && placed.col === targetCol) {
      const seat = document.querySelector(`#seat-${placed.row}-${placed.col}`);
      const mark = document.createElement('span');
      mark.className = 'mark';
      mark.textContent = '✅';
      seat.appendChild(mark);

      feedback.textContent = '太棒了！給你一個讚！👍';
      feedback.className = 'feedback correct';

      correctStreak++;
      updateProgress();

      if (correctStreak >= 3) {
        setTimeout(() => {
          rewardOverlay.classList.add('show');
        }, 800);
      }
    } else {
      const seat = document.querySelector(`#seat-${placed.row}-${placed.col}`);
      if (seat) {
        const mark = document.createElement('span');
        mark.className = 'mark';
        mark.textContent = '❌';
        seat.appendChild(mark);
      }

      feedback.textContent = '哎呀，再想一想喔！相信你可以的！💪';
      feedback.className = 'feedback wrong';
    }
  }

  function updateProgress() {
    const stars = '⭐'.repeat(correctStreak);
    progress.textContent = correctStreak > 0 ? `連續答對：${stars}` : '';
  }

  // ====== 重設 ======
  function resetAll() {
    currentQuestion = null;
    placedStudents = {};
    dragData = null;
    questionBox.innerHTML = '請點擊「出題」開始練習 😊';
    feedback.textContent = '';
    feedback.className = 'feedback';
    rewardOverlay.classList.remove('show');

    document.querySelectorAll('.seat').forEach(seat => {
      seat.innerHTML = '';
    });

    document.querySelectorAll('.mark').forEach(m => m.remove());

    initWaitingArea();
  }

  // ====== 事件綁定 ======
  document.getElementById('btnNewQ').addEventListener('click', newQuestion);
  document.getElementById('btnReset').addEventListener('click', resetAll);
  document.getElementById('btnPlayAgain').addEventListener('click', resetAll);

  // ====== 啟動 ======
  redrawTable();
  initWaitingArea();
  updateProgress();

</script>
</body>
</html>
